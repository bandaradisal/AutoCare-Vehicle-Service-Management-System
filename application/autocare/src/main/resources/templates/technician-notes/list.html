<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Technician Notes - AutoCare
    </title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 95%;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .add-button {
            background-color: #2563eb;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
        }

        .add-button:hover {
            background-color: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            padding: 11px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #e5e7eb;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .note-list {
            margin: 0;
            padding-left: 18px;
        }

        .edit-button {
            background-color: #f59e0b;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-right: 5px;
        }

        .edit-button:hover {
            background-color: #d97706;
        }

        .delete-form {
            display: inline;
        }

        .delete-button {
            background-color: #dc2626;
            color: white;
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-button:hover {
            background-color: #b91c1c;
        }

        .empty-message {
            padding: 20px;
            background-color: white;
            text-align: center;
        }

    </style>

</head>

<body>


<div class="header">

    <h1>
        AutoCare
    </h1>

    <p>
        Vehicle Service & Maintenance Management System
    </p>

</div>


<!-- DASHBOARD BUTTON -->
<div th:replace="~{fragments/navigation :: homeButton}"></div>


<div class="container">


    <div class="top-bar">

        <h2>
            Technician Notes - MongoDB
        </h2>

        <a th:href="@{/technician-notes/new}"
           class="add-button">

            + Add Technician Note

        </a>

    </div>


    <!-- TECHNICIAN NOTES TABLE -->

    <table th:if="${technicianNotes != null
            and !technicianNotes.isEmpty()}">

        <thead>

        <tr>

            <th>Note ID</th>

            <th>Job Card ID</th>

            <th>Technician ID</th>

            <th>Created At</th>

            <th>Notes</th>

            <th>Actions</th>

        </tr>

        </thead>


        <tbody>


        <tr th:each="technicianNote : ${technicianNotes}">


            <!-- NOTE ID -->

            <td>

                <strong th:text="${technicianNote.noteId}">
                    TN001
                </strong>

            </td>


            <!-- JOB CARD -->

            <td th:text="${technicianNote.jobCardId}">
                JC001
            </td>


            <!-- TECHNICIAN -->

            <td th:text="${technicianNote.technicianId}">
                41
            </td>


            <!-- CREATED DATE -->

            <td>

                <span th:if="${technicianNote.createdAt != null}"
                      th:text="${technicianNote.createdAt}">
                </span>

                <span th:if="${technicianNote.createdAt == null}">
                    -
                </span>

            </td>


            <!-- NOTES -->

            <td>

                <ul class="note-list"
                    th:if="${technicianNote.notes != null
                    and !technicianNote.notes.isEmpty()}">

                    <li th:each="note : ${technicianNote.notes}"
                        th:text="${note}">

                        Technician note

                    </li>

                </ul>


                <span th:if="${technicianNote.notes == null
                        or technicianNote.notes.isEmpty()}">

                    No notes

                </span>

            </td>


            <!-- ACTIONS -->

            <td>


                <!-- EDIT USING CUSTOM NOTE ID -->

                <a class="edit-button"
                   th:href="@{/technician-notes/edit/{noteId}
                   (noteId=${technicianNote.noteId})}">

                    Edit

                </a>


                <!-- DELETE USING CUSTOM NOTE ID -->

                <form class="delete-form"

                      th:action="@{/technician-notes/delete/{noteId}
                      (noteId=${technicianNote.noteId})}"

                      method="post"

                      onsubmit="return confirm(
                      'Are you sure you want to delete this technician note?'
                      );">

                    <button type="submit"
                            class="delete-button">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>


    <!-- EMPTY MESSAGE -->

    <div class="empty-message"
         th:if="${technicianNotes == null
         or technicianNotes.isEmpty()}">

        No MongoDB technician notes found.

    </div>


</div>


</body>

</html>
