<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payments - AutoCare</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 95%;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .add-button {
            background-color: #2563eb;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
        }

        .add-button:hover {
            background-color: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            padding: 11px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #e5e7eb;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .status-completed {
            color: #15803d;
            font-weight: bold;
        }

        .status-pending {
            color: #d97706;
            font-weight: bold;
        }

        .status-failed {
            color: #dc2626;
            font-weight: bold;
        }

        .status-refunded {
            color: #6b7280;
            font-weight: bold;
        }

        .edit-button {
            background-color: #f59e0b;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-right: 5px;
        }

        .edit-button:hover {
            background-color: #d97706;
        }

        .delete-form {
            display: inline;
        }

        .delete-button {
            background-color: #dc2626;
            color: white;
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-button:hover {
            background-color: #b91c1c;
        }

        .empty-message {
            padding: 20px;
            background-color: white;
            text-align: center;
        }
    </style>

</head>

<body>

<div class="header">

    <h1>AutoCare</h1>

    <p>
        Vehicle Service & Maintenance Management System
    </p>

</div>

<!-- DASHBOARD BUTTON -->
<div th:replace="~{fragments/navigation :: homeButton}"></div>

<div class="container">

    <div class="top-bar">

        <h2>
            Payment Management
        </h2>

        <a th:href="@{/payments/new}"
           class="add-button">

            + Record Payment

        </a>

    </div>


    <!-- PAYMENT TABLE -->

    <table th:if="${payments != null and !payments.isEmpty()}">

        <thead>

        <tr>
            <th>Payment ID</th>
            <th>Invoice ID</th>
            <th>Customer</th>
            <th>Vehicle</th>
            <th>Amount</th>
            <th>Method</th>
            <th>Status</th>
            <th>Reference</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="payment : ${payments}">


            <!-- PAYMENT ID -->

            <td th:text="${payment.paymentId}">
            </td>


            <!-- INVOICE -->

            <td>

                <span th:if="${payment.invoice != null}"
                      th:text="${payment.invoice.invoiceId}">
                </span>

                <span th:if="${payment.invoice == null}">
                    -
                </span>

            </td>


            <!-- CUSTOMER -->

            <td>

                <span th:if="${payment.invoice != null
                        and payment.invoice.booking != null
                        and payment.invoice.booking.vehicle != null
                        and payment.invoice.booking.vehicle.customer != null}"
                      th:text="${payment.invoice.booking.vehicle.customer.firstName
                      + ' '
                      + payment.invoice.booking.vehicle.customer.lastName}">
                </span>

                <span th:if="${payment.invoice == null
                        or payment.invoice.booking == null
                        or payment.invoice.booking.vehicle == null
                        or payment.invoice.booking.vehicle.customer == null}">
                    -
                </span>

            </td>


            <!-- VEHICLE -->

            <td>

                <span th:if="${payment.invoice != null
                        and payment.invoice.booking != null
                        and payment.invoice.booking.vehicle != null}"
                      th:text="${payment.invoice.booking.vehicle.registrationNo}">
                </span>

                <span th:if="${payment.invoice == null
                        or payment.invoice.booking == null
                        or payment.invoice.booking.vehicle == null}">
                    -
                </span>

            </td>


            <!-- AMOUNT -->

            <td>

                <strong th:if="${payment.amount != null}"
                        th:text="${'LKR ' + payment.amount}">
                </strong>

                <span th:if="${payment.amount == null}">
                    -
                </span>

            </td>


            <!-- METHOD -->

            <td th:text="${payment.paymentMethod}">
            </td>


            <!-- STATUS -->

            <td>

                <span th:if="${payment.paymentStatus == 'Completed'}"
                      class="status-completed"
                      th:text="${payment.paymentStatus}">
                </span>

                <span th:if="${payment.paymentStatus == 'Pending'}"
                      class="status-pending"
                      th:text="${payment.paymentStatus}">
                </span>

                <span th:if="${payment.paymentStatus == 'Failed'}"
                      class="status-failed"
                      th:text="${payment.paymentStatus}">
                </span>

                <span th:if="${payment.paymentStatus == 'Refunded'}"
                      class="status-refunded"
                      th:text="${payment.paymentStatus}">
                </span>

                <span th:if="${payment.paymentStatus == null}">
                    -
                </span>

            </td>


            <!-- REFERENCE -->

            <td>

                <span th:if="${payment.referenceNo != null
                        and !payment.referenceNo.isBlank()}"
                      th:text="${payment.referenceNo}">
                </span>

                <span th:if="${payment.referenceNo == null
                        or payment.referenceNo.isBlank()}">
                    -
                </span>

            </td>


            <!-- ACTIONS -->

            <td>

                <a class="edit-button"
                   th:href="@{/payments/edit/{id}
                   (id=${payment.paymentId})}">

                    Edit

                </a>

                <form class="delete-form"
                      th:action="@{/payments/delete/{id}
                      (id=${payment.paymentId})}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete this payment? The related invoice status may change automatically.');">

                    <button type="submit"
                            class="delete-button">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>


    <!-- EMPTY MESSAGE -->

    <div class="empty-message"
         th:if="${payments == null or payments.isEmpty()}">

        No payments found.

    </div>

</div>

</body>

</html>
