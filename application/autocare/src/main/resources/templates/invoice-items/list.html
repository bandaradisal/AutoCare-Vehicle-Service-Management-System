<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invoice Items - AutoCare</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 95%;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .add-button {
            background-color: #2563eb;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
        }

        .add-button:hover {
            background-color: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            padding: 11px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #e5e7eb;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .edit-button {
            background-color: #f59e0b;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-right: 5px;
        }

        .edit-button:hover {
            background-color: #d97706;
        }

        .delete-form {
            display: inline;
        }

        .delete-button {
            background-color: #dc2626;
            color: white;
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-button:hover {
            background-color: #b91c1c;
        }

        .empty-message {
            padding: 20px;
            background-color: white;
            text-align: center;
        }

        .money {
            font-weight: bold;
        }
    </style>

</head>

<body>

<div class="header">

    <h1>AutoCare</h1>

    <p>
        Vehicle Service & Maintenance Management System
    </p>

</div>

<!-- DASHBOARD BUTTON -->
<div th:replace="~{fragments/navigation :: homeButton}"></div>

<div class="container">

    <div class="top-bar">

        <h2>
            Invoice Item Management
        </h2>

        <a th:href="@{/invoice-items/new}"
           class="add-button">

            + Add Invoice Item

        </a>

    </div>


    <!-- INVOICE ITEM TABLE -->

    <table th:if="${invoiceItems != null and !invoiceItems.isEmpty()}">

        <thead>

        <tr>
            <th>Item ID</th>
            <th>Invoice ID</th>
            <th>Vehicle</th>
            <th>Spare Part</th>
            <th>Quantity</th>
            <th>Unit Price</th>
            <th>Subtotal</th>
            <th>Actions</th>
        </tr>

        </thead>


        <tbody>

        <tr th:each="item : ${invoiceItems}">


            <!-- ITEM ID -->

            <td th:text="${item.invoiceItemId}">
            </td>


            <!-- INVOICE ID -->

            <td>

                <span th:if="${item.invoice != null}"
                      th:text="${item.invoice.invoiceId}">
                </span>

                <span th:if="${item.invoice == null}">
                    -
                </span>

            </td>


            <!-- VEHICLE -->

            <td>

                <span th:if="${item.invoice != null
                        and item.invoice.booking != null
                        and item.invoice.booking.vehicle != null}"
                      th:text="${item.invoice.booking.vehicle.registrationNo}">
                </span>

                <span th:if="${item.invoice == null
                        or item.invoice.booking == null
                        or item.invoice.booking.vehicle == null}">
                    -
                </span>

            </td>


            <!-- SPARE PART -->

            <td>

                <span th:if="${item.sparePart != null}"
                      th:text="${item.sparePart.partName}">
                </span>

                <span th:if="${item.sparePart == null}">
                    -
                </span>

            </td>


            <!-- QUANTITY -->

            <td th:text="${item.quantity}">
            </td>


            <!-- UNIT PRICE -->

            <td>

                <span th:if="${item.unitPrice != null}"
                      th:text="${'LKR ' + item.unitPrice}">
                </span>

                <span th:if="${item.unitPrice == null}">
                    -
                </span>

            </td>


            <!-- SUBTOTAL -->

            <td>

                <strong class="money"
                        th:if="${item.subtotal != null}"
                        th:text="${'LKR ' + item.subtotal}">
                </strong>

                <span th:if="${item.subtotal == null}">
                    -
                </span>

            </td>


            <!-- ACTIONS -->

            <td>

                <a class="edit-button"
                   th:href="@{/invoice-items/edit/{id}
                   (id=${item.invoiceItemId})}">

                    Edit

                </a>

                <form class="delete-form"
                      th:action="@{/invoice-items/delete/{id}
                      (id=${item.invoiceItemId})}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete this invoice item? The spare-part stock will be restored automatically.');">

                    <button type="submit"
                            class="delete-button">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>


    <!-- EMPTY MESSAGE -->

    <div class="empty-message"
         th:if="${invoiceItems == null or invoiceItems.isEmpty()}">

        No invoice items found.

    </div>

</div>

</body>

</html>
