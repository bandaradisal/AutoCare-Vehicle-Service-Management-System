<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Complaints & Feedback - AutoCare
    </title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 95%;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .add-button {
            background-color: #2563eb;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
        }

        .add-button:hover {
            background-color: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            padding: 11px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #e5e7eb;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .type-complaint {
            color: #dc2626;
            font-weight: bold;
        }

        .type-feedback {
            color: #16a34a;
            font-weight: bold;
        }

        .status-open {
            color: #2563eb;
            font-weight: bold;
        }

        .status-review {
            color: #d97706;
            font-weight: bold;
        }

        .status-resolved {
            color: #15803d;
            font-weight: bold;
        }

        .status-closed {
            color: #6b7280;
            font-weight: bold;
        }

        .edit-button {
            background-color: #f59e0b;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-right: 5px;
        }

        .edit-button:hover {
            background-color: #d97706;
        }

        .delete-form {
            display: inline;
        }

        .delete-button {
            background-color: #dc2626;
            color: white;
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-button:hover {
            background-color: #b91c1c;
        }

        .empty-message {
            padding: 20px;
            background-color: white;
            text-align: center;
        }

    </style>

</head>

<body>


<div class="header">

    <h1>
        AutoCare
    </h1>

    <p>
        Vehicle Service & Maintenance Management System
    </p>

</div>


<!-- DASHBOARD BUTTON -->
<div th:replace="~{fragments/navigation :: homeButton}"></div>


<div class="container">


    <div class="top-bar">

        <h2>
            Complaints & Feedback - MongoDB
        </h2>

        <a th:href="@{/complaints-feedback/new}"
           class="add-button">

            + Add Complaint / Feedback

        </a>

    </div>


    <!-- COMPLAINTS / FEEDBACK TABLE -->

    <table th:if="${complaintsFeedback != null
            and !complaintsFeedback.isEmpty()}">

        <thead>

        <tr>

            <th>ID</th>
            <th>Customer ID</th>
            <th>Vehicle ID</th>
            <th>Type</th>
            <th>Message</th>
            <th>Status</th>
            <th>Rating</th>
            <th>Submitted At</th>
            <th>Actions</th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="record : ${complaintsFeedback}">


            <!-- ID -->

            <td>

                <strong th:text="${record.complaintId}">
                    CMP001
                </strong>

            </td>


            <!-- CUSTOMER ID -->

            <td>

                <span th:if="${record.customerId != null}"
                      th:text="${record.customerId}">
                </span>

                <span th:if="${record.customerId == null}">
                    -
                </span>

            </td>


            <!-- VEHICLE ID -->

            <td>

                <span th:if="${record.vehicleId != null}"
                      th:text="${record.vehicleId}">
                </span>

                <span th:if="${record.vehicleId == null}">
                    -
                </span>

            </td>


            <!-- TYPE -->

            <td>

                <span th:if="${record.type == 'Complaint'}"
                      class="type-complaint"
                      th:text="${record.type}">
                </span>

                <span th:if="${record.type == 'Feedback'}"
                      class="type-feedback"
                      th:text="${record.type}">
                </span>

                <span th:if="${record.type == null}">
                    -
                </span>

            </td>


            <!-- MESSAGE -->

            <td>

                <span th:if="${record.message != null
                        and !record.message.isBlank()}"
                      th:text="${record.message}">
                </span>

                <span th:if="${record.message == null
                        or record.message.isBlank()}">
                    -
                </span>

            </td>


            <!-- STATUS -->

            <td>

                <span th:if="${record.status == 'Open'}"
                      class="status-open"
                      th:text="${record.status}">
                </span>

                <span th:if="${record.status == 'Under Review'}"
                      class="status-review"
                      th:text="${record.status}">
                </span>

                <span th:if="${record.status == 'Resolved'}"
                      class="status-resolved"
                      th:text="${record.status}">
                </span>

                <span th:if="${record.status == 'Closed'}"
                      class="status-closed"
                      th:text="${record.status}">
                </span>

                <span th:if="${record.status == null}">
                    -
                </span>

            </td>


            <!-- RATING -->

            <td>

                <span th:if="${record.rating != null}"
                      th:text="${record.rating + ' / 5'}">

                    5 / 5

                </span>

                <span th:if="${record.rating == null}">

                    -

                </span>

            </td>


            <!-- SUBMITTED DATE -->

            <td>

                <span th:if="${record.submittedAt != null}"
                      th:text="${record.submittedAt}">
                </span>

                <span th:if="${record.submittedAt == null}">
                    -
                </span>

            </td>


            <!-- ACTIONS -->

            <td>


                <!-- EDIT USING CUSTOM COMPLAINT ID -->

                <a class="edit-button"
                   th:href="@{/complaints-feedback/edit/{complaintId}
                   (complaintId=${record.complaintId})}">

                    Edit

                </a>


                <!-- DELETE USING CUSTOM COMPLAINT ID -->

                <form class="delete-form"
                      th:action="@{/complaints-feedback/delete/{complaintId}
                      (complaintId=${record.complaintId})}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete this complaint or feedback record?');">

                    <button type="submit"
                            class="delete-button">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>


    <!-- EMPTY MESSAGE -->

    <div class="empty-message"
         th:if="${complaintsFeedback == null
         or complaintsFeedback.isEmpty()}">

        No complaints or feedback found.

    </div>


</div>


</body>

</html>
