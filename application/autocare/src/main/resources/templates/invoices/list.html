<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invoices - AutoCare</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 96%;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .add-button {
            background-color: #2563eb;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
        }

        .add-button:hover {
            background-color: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #e5e7eb;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .status-unpaid {
            color: #dc2626;
            font-weight: bold;
        }

        .status-partial {
            color: #d97706;
            font-weight: bold;
        }

        .status-paid {
            color: #15803d;
            font-weight: bold;
        }

        .status-cancelled {
            color: #6b7280;
            font-weight: bold;
        }

        .edit-button {
            background-color: #f59e0b;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-right: 5px;
        }

        .edit-button:hover {
            background-color: #d97706;
        }

        .delete-form {
            display: inline;
        }

        .delete-button {
            background-color: #dc2626;
            color: white;
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-button:hover {
            background-color: #b91c1c;
        }

        .empty-message {
            padding: 20px;
            background-color: white;
            text-align: center;
        }
    </style>

</head>

<body>

<div class="header">

    <h1>AutoCare</h1>

    <p>
        Vehicle Service & Maintenance Management System
    </p>

</div>

<!-- DASHBOARD BUTTON -->
<div th:replace="~{fragments/navigation :: homeButton}"></div>

<div class="container">

    <div class="top-bar">

        <h2>
            Invoice Management
        </h2>

        <a th:href="@{/invoices/new}"
           class="add-button">

            + Create Invoice

        </a>

    </div>


    <!-- INVOICE TABLE -->

    <table th:if="${invoices != null and !invoices.isEmpty()}">

        <thead>

        <tr>
            <th>Invoice ID</th>
            <th>Booking ID</th>
            <th>Vehicle</th>
            <th>Customer</th>
            <th>Service Charge</th>
            <th>Parts Total</th>
            <th>Tax</th>
            <th>Discount</th>
            <th>Total</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="invoice : ${invoices}">


            <!-- INVOICE ID -->

            <td th:text="${invoice.invoiceId}">
            </td>


            <!-- BOOKING ID -->

            <td>

                <span th:if="${invoice.booking != null}"
                      th:text="${invoice.booking.bookingId}">
                </span>

                <span th:if="${invoice.booking == null}">
                    -
                </span>

            </td>


            <!-- VEHICLE -->

            <td>

                <span th:if="${invoice.booking != null
                        and invoice.booking.vehicle != null}"
                      th:text="${invoice.booking.vehicle.registrationNo}">
                </span>

                <span th:if="${invoice.booking == null
                        or invoice.booking.vehicle == null}">
                    -
                </span>

            </td>


            <!-- CUSTOMER -->

            <td>

                <span th:if="${invoice.booking != null
                        and invoice.booking.vehicle != null
                        and invoice.booking.vehicle.customer != null}"
                      th:text="${invoice.booking.vehicle.customer.firstName
                      + ' '
                      + invoice.booking.vehicle.customer.lastName}">
                </span>

                <span th:if="${invoice.booking == null
                        or invoice.booking.vehicle == null
                        or invoice.booking.vehicle.customer == null}">
                    -
                </span>

            </td>


            <!-- SERVICE CHARGE -->

            <td>

                <span th:if="${invoice.serviceCharge != null}"
                      th:text="${'LKR ' + invoice.serviceCharge}">
                </span>

                <span th:if="${invoice.serviceCharge == null}">
                    LKR 0
                </span>

            </td>


            <!-- PARTS TOTAL -->

            <td>

                <span th:if="${invoice.partsTotal != null}"
                      th:text="${'LKR ' + invoice.partsTotal}">
                </span>

                <span th:if="${invoice.partsTotal == null}">
                    LKR 0
                </span>

            </td>


            <!-- TAX -->

            <td>

                <span th:if="${invoice.taxAmount != null}"
                      th:text="${'LKR ' + invoice.taxAmount}">
                </span>

                <span th:if="${invoice.taxAmount == null}">
                    LKR 0
                </span>

            </td>


            <!-- DISCOUNT -->

            <td>

                <span th:if="${invoice.discount != null}"
                      th:text="${'LKR ' + invoice.discount}">
                </span>

                <span th:if="${invoice.discount == null}">
                    LKR 0
                </span>

            </td>


            <!-- TOTAL -->

            <td>

                <strong th:if="${invoice.totalAmount != null}"
                        th:text="${'LKR ' + invoice.totalAmount}">
                </strong>

                <strong th:if="${invoice.totalAmount == null}">
                    LKR 0
                </strong>

            </td>


            <!-- STATUS -->

            <td>

                <span th:if="${invoice.invoiceStatus == 'Unpaid'}"
                      class="status-unpaid"
                      th:text="${invoice.invoiceStatus}">
                </span>

                <span th:if="${invoice.invoiceStatus == 'Partially Paid'}"
                      class="status-partial"
                      th:text="${invoice.invoiceStatus}">
                </span>

                <span th:if="${invoice.invoiceStatus == 'Paid'}"
                      class="status-paid"
                      th:text="${invoice.invoiceStatus}">
                </span>

                <span th:if="${invoice.invoiceStatus == 'Cancelled'}"
                      class="status-cancelled"
                      th:text="${invoice.invoiceStatus}">
                </span>

                <span th:if="${invoice.invoiceStatus == null}">
                    -
                </span>

            </td>


            <!-- ACTIONS -->

            <td>

                <a class="edit-button"
                   th:href="@{/invoices/edit/{id}
                   (id=${invoice.invoiceId})}">

                    Edit

                </a>

                <form class="delete-form"
                      th:action="@{/invoices/delete/{id}
                      (id=${invoice.invoiceId})}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete this invoice?');">

                    <button type="submit"
                            class="delete-button">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>


    <!-- EMPTY MESSAGE -->

    <div class="empty-message"
         th:if="${invoices == null or invoices.isEmpty()}">

        No invoices found.

    </div>

</div>

</body>

</html>
