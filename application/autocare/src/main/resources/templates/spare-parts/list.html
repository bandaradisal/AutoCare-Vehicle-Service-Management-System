<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spare Parts - AutoCare</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 92%;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .add-button {
            background-color: #2563eb;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
        }

        .add-button:hover {
            background-color: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #e5e7eb;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .low-stock {
            color: #dc2626;
            font-weight: bold;
        }

        .normal-stock {
            color: #15803d;
            font-weight: bold;
        }

        .edit-button {
            background-color: #f59e0b;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-right: 5px;
        }

        .edit-button:hover {
            background-color: #d97706;
        }

        .delete-form {
            display: inline;
        }

        .delete-button {
            background-color: #dc2626;
            color: white;
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-button:hover {
            background-color: #b91c1c;
        }

        .empty-message {
            padding: 20px;
            background-color: white;
            text-align: center;
        }
    </style>

</head>

<body>

<div class="header">

    <h1>AutoCare</h1>

    <p>
        Vehicle Service & Maintenance Management System
    </p>

</div>

<!-- DASHBOARD BUTTON -->
<div th:replace="~{fragments/navigation :: homeButton}"></div>

<div class="container">

    <div class="top-bar">

        <h2>
            Spare Part Inventory
        </h2>

        <a th:href="@{/spare-parts/new}"
           class="add-button">

            + Add Spare Part

        </a>

    </div>


    <!-- SPARE PART TABLE -->

    <table th:if="${spareParts != null and !spareParts.isEmpty()}">

        <thead>

        <tr>
            <th>ID</th>
            <th>Part Name</th>
            <th>Category</th>
            <th>Unit Price</th>
            <th>Stock</th>
            <th>Reorder Level</th>
            <th>Supplier</th>
            <th>Stock Status</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="part : ${spareParts}">

            <!-- ID -->
            <td th:text="${part.partId}">
            </td>

            <!-- PART NAME -->
            <td th:text="${part.partName}">
            </td>

            <!-- CATEGORY -->
            <td>

                <span th:if="${part.partCategory != null and !part.partCategory.isBlank()}"
                      th:text="${part.partCategory}">
                </span>

                <span th:if="${part.partCategory == null or part.partCategory.isBlank()}">
                    -
                </span>

            </td>

            <!-- UNIT PRICE -->
            <td>

                <span th:if="${part.unitPrice != null}"
                      th:text="${'LKR ' + part.unitPrice}">
                </span>

                <span th:if="${part.unitPrice == null}">
                    -
                </span>

            </td>

            <!-- STOCK -->
            <td th:text="${part.quantityInStock}">
            </td>

            <!-- REORDER LEVEL -->
            <td th:text="${part.reorderLevel}">
            </td>

            <!-- SUPPLIER -->
            <td>

                <span th:if="${part.supplierName != null and !part.supplierName.isBlank()}"
                      th:text="${part.supplierName}">
                </span>

                <span th:if="${part.supplierName == null or part.supplierName.isBlank()}">
                    -
                </span>

            </td>

            <!-- STOCK STATUS -->
            <td>

                <span th:if="${part.quantityInStock != null
                        and part.reorderLevel != null
                        and part.quantityInStock <= part.reorderLevel}"
                      class="low-stock">

                    Low Stock

                </span>

                <span th:if="${part.quantityInStock != null
                        and part.reorderLevel != null
                        and part.quantityInStock > part.reorderLevel}"
                      class="normal-stock">

                    In Stock

                </span>

                <span th:if="${part.quantityInStock == null
                        or part.reorderLevel == null}">
                    -
                </span>

            </td>

            <!-- ACTIONS -->
            <td>

                <a class="edit-button"
                   th:href="@{/spare-parts/edit/{id}
                   (id=${part.partId})}">

                    Edit

                </a>

                <form class="delete-form"
                      th:action="@{/spare-parts/delete/{id}
                      (id=${part.partId})}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete this spare part?');">

                    <button type="submit"
                            class="delete-button">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>


    <!-- EMPTY MESSAGE -->

    <div class="empty-message"
         th:if="${spareParts == null or spareParts.isEmpty()}">

        No spare parts found.

    </div>

</div>

</body>

</html>
