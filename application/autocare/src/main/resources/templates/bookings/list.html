<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Service Bookings - AutoCare</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 94%;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .add-button {
            background-color: #2563eb;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
        }

        .add-button:hover {
            background-color: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            padding: 11px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #e5e7eb;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .edit-button {
            background-color: #f59e0b;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-right: 5px;
        }

        .edit-button:hover {
            background-color: #d97706;
        }

        .delete-form {
            display: inline;
        }

        .delete-button {
            background-color: #dc2626;
            color: white;
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-button:hover {
            background-color: #b91c1c;
        }

        .empty-message {
            padding: 20px;
            text-align: center;
            background-color: white;
        }
    </style>

</head>

<body>

<div class="header">

    <h1>AutoCare</h1>

    <p>
        Vehicle Service & Maintenance Management System
    </p>

</div>

<!-- DASHBOARD BUTTON -->
<div th:replace="~{fragments/navigation :: homeButton}"></div>

<div class="container">

    <div class="top-bar">

        <h2>
            Service Booking Management
        </h2>

        <a th:href="@{/bookings/new}"
           class="add-button">

            + Add Booking

        </a>

    </div>


    <!-- BOOKINGS TABLE -->

    <table th:if="${bookings != null and !bookings.isEmpty()}">

        <thead>

        <tr>

            <th>ID</th>
            <th>Vehicle</th>
            <th>Customer</th>
            <th>Service Date</th>
            <th>Service Type</th>
            <th>Description</th>
            <th>Estimated Cost</th>
            <th>Status</th>
            <th>Actions</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="booking : ${bookings}">


            <!-- BOOKING ID -->

            <td th:text="${booking.bookingId}">
            </td>


            <!-- VEHICLE -->

            <td>

                <span th:if="${booking.vehicle != null}"
                      th:text="${booking.vehicle.registrationNo}">
                </span>

                <span th:if="${booking.vehicle == null}">
                    -
                </span>

            </td>


            <!-- CUSTOMER -->

            <td>

                <span th:if="${booking.vehicle != null
                        and booking.vehicle.customer != null}"
                      th:text="${booking.vehicle.customer.firstName
                      + ' '
                      + booking.vehicle.customer.lastName}">
                </span>

                <span th:if="${booking.vehicle == null
                        or booking.vehicle.customer == null}">
                    -
                </span>

            </td>


            <!-- SERVICE DATE -->

            <td th:text="${booking.serviceDate}">
            </td>


            <!-- SERVICE TYPE -->

            <td th:text="${booking.serviceType}">
            </td>


            <!-- DESCRIPTION -->

            <td th:text="${booking.description}">
            </td>


            <!-- ESTIMATED COST -->

            <td>

                <span th:if="${booking.estimatedCost != null}"
                      th:text="${'LKR ' + booking.estimatedCost}">
                </span>

                <span th:if="${booking.estimatedCost == null}">
                    -
                </span>

            </td>


            <!-- STATUS -->

            <td th:text="${booking.bookingStatus}">
            </td>


            <!-- ACTIONS -->

            <td>

                <!-- EDIT -->

                <a class="edit-button"
                   th:href="@{/bookings/edit/{id}
                   (id=${booking.bookingId})}">

                    Edit

                </a>


                <!-- DELETE -->

                <form class="delete-form"
                      th:action="@{/bookings/delete/{id}
                      (id=${booking.bookingId})}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete this booking?');">

                    <button type="submit"
                            class="delete-button">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>


    <!-- EMPTY MESSAGE -->

    <div class="empty-message"
         th:if="${bookings == null or bookings.isEmpty()}">

        No service bookings found.

    </div>

</div>

</body>

</html>
