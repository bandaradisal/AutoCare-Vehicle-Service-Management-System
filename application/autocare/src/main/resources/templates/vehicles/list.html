<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Vehicles - AutoCare
    </title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .add-button {
            background-color: #2563eb;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
        }

        .add-button:hover {
            background-color: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #e5e7eb;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .edit-button {
            background-color: #f59e0b;
            color: white;
            padding: 7px 14px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-right: 6px;
        }

        .edit-button:hover {
            background-color: #d97706;
        }

        .delete-form {
            display: inline;
        }

        .delete-button {
            background-color: #dc2626;
            color: white;
            padding: 7px 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-button:hover {
            background-color: #b91c1c;
        }

        .empty-message {
            padding: 20px;
            background-color: white;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="header">

    <h1>
        AutoCare
    </h1>

    <p>
        Vehicle Service & Maintenance Management System
    </p>

</div>

<!-- DASHBOARD BUTTON -->
<div th:replace="~{fragments/navigation :: homeButton}"></div>

<div class="container">

    <div class="top-bar">

        <h2>
            Vehicle Management
        </h2>

        <a th:href="@{/vehicles/new}"
           class="add-button">

            + Add Vehicle

        </a>

    </div>


    <!-- VEHICLE TABLE -->

    <table th:if="${vehicles != null and !vehicles.isEmpty()}">

        <thead>

        <tr>

            <th>ID</th>
            <th>Registration No</th>
            <th>Customer</th>
            <th>Brand</th>
            <th>Model</th>
            <th>Year</th>
            <th>Fuel Type</th>
            <th>Mileage</th>
            <th>Actions</th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="vehicle : ${vehicles}">


            <!-- VEHICLE ID -->

            <td th:text="${vehicle.vehicleId}">
            </td>


            <!-- REGISTRATION -->

            <td th:text="${vehicle.registrationNo}">
            </td>


            <!-- CUSTOMER -->

            <td>

                <span th:if="${vehicle.customer != null}"
                      th:text="${vehicle.customer.firstName
                      + ' '
                      + vehicle.customer.lastName}">
                </span>

                <span th:if="${vehicle.customer == null}">
                    -
                </span>

            </td>


            <!-- BRAND -->

            <td th:text="${vehicle.brand}">
            </td>


            <!-- MODEL -->

            <td th:text="${vehicle.model}">
            </td>


            <!-- YEAR -->

            <td th:text="${vehicle.manufactureYear}">
            </td>


            <!-- FUEL TYPE -->

            <td th:text="${vehicle.fuelType}">
            </td>


            <!-- MILEAGE -->

            <td th:text="${vehicle.currentMileage}">
            </td>


            <!-- ACTIONS -->

            <td>


                <!-- EDIT -->

                <a class="edit-button"
                   th:href="@{/vehicles/edit/{id}
                   (id=${vehicle.vehicleId})}">

                    Edit

                </a>


                <!-- DELETE -->

                <form class="delete-form"
                      th:action="@{/vehicles/delete/{id}
                      (id=${vehicle.vehicleId})}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete this vehicle?');">

                    <button type="submit"
                            class="delete-button">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>


    <!-- EMPTY MESSAGE -->

    <div class="empty-message"
         th:if="${vehicles == null or vehicles.isEmpty()}">

        No vehicles found.

    </div>

</div>

</body>

</html>
