<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AutoCare | Access Denied</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left,
                rgba(255, 50, 50, 0.10),
                transparent 35%),
                #080808;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .error-card {
            width: 100%;
            max-width: 650px;

            background: #111111;

            border: 1px solid #262626;
            border-radius: 24px;

            padding: 55px 45px;

            text-align: center;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.60);
        }

        .brand {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 35px;
        }

        .brand span {
            color: #ff3b3b;
        }

        .error-code {
            font-size: 85px;
            font-weight: 900;
            color: #ff3b3b;
            line-height: 1;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .message {
            color: #9ca3af;
            font-size: 16px;
            line-height: 1.7;
            max-width: 500px;
            margin: 0 auto 30px auto;
        }

        .role-box {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            background: #171717;
            border: 1px solid #292929;

            padding: 10px 16px;
            border-radius: 10px;

            margin-bottom: 30px;

            color: #cccccc;
            font-size: 13px;
        }

        .role {
            color: #ff6565;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .dashboard-button {
            display: inline-block;

            background: #2563eb;
            color: white;

            text-decoration: none;

            padding: 13px 20px;
            border-radius: 9px;

            font-weight: bold;
            font-size: 14px;
        }

        .back-button {
            display: inline-block;

            background: #252525;
            color: white;

            text-decoration: none;

            padding: 13px 20px;
            border-radius: 9px;

            border: none;
            cursor: pointer;

            font-weight: bold;
            font-size: 14px;
        }

        .footer {
            margin-top: 35px;
            color: #555555;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="error-card">

    <div class="brand">
        AUTO<span>CARE</span>
    </div>

    <div class="error-code">
        403
    </div>

    <h1>Access Denied</h1>

    <p class="message">
        Your account does not have permission to access
        this AutoCare module.
        Please return to the dashboard and select a function
        available for your assigned role.
    </p>

    <div class="role-box"
         th:if="${currentUsername != null}">

        Signed in as

        <strong th:text="${currentUsername}">
            user
        </strong>

        <span>•</span>

        <span class="role"
              th:text="${currentRole}">
            ROLE
        </span>

    </div>

    <div class="buttons">

        <a th:href="@{/}"
           class="dashboard-button">
            ← Dashboard
        </a>

        <button type="button"
                onclick="history.back()"
                class="back-button">
            Go Back
        </button>

    </div>

    <div class="footer">
        AutoCare Vehicle Service & Maintenance Management System
    </div>

</div>

</body>
</html>
