<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Cards - AutoCare</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 95%;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .add-button {
            background-color: #2563eb;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
        }

        .add-button:hover {
            background-color: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            padding: 11px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #e5e7eb;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .task-list {
            margin: 0;
            padding-left: 18px;
        }

        .status-open {
            color: #2563eb;
            font-weight: bold;
        }

        .status-progress {
            color: #d97706;
            font-weight: bold;
        }

        .status-completed {
            color: #15803d;
            font-weight: bold;
        }

        .status-cancelled {
            color: #dc2626;
            font-weight: bold;
        }

        .edit-button {
            background-color: #f59e0b;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-right: 5px;
        }

        .edit-button:hover {
            background-color: #d97706;
        }

        .delete-form {
            display: inline;
        }

        .delete-button {
            background-color: #dc2626;
            color: white;
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-button:hover {
            background-color: #b91c1c;
        }

        .empty-message {
            padding: 20px;
            background-color: white;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="header">

    <h1>AutoCare</h1>

    <p>
        Vehicle Service & Maintenance Management System
    </p>

</div>

<!-- DASHBOARD BUTTON -->
<div th:replace="~{fragments/navigation :: homeButton}"></div>

<div class="container">

    <div class="top-bar">

        <h2>
            Job Card Management - MongoDB
        </h2>

        <a th:href="@{/job-cards/new}"
           class="add-button">

            + Add Job Card

        </a>

    </div>


    <!-- JOB CARD TABLE -->

    <table th:if="${jobCards != null and !jobCards.isEmpty()}">

        <thead>

        <tr>

            <th>Job Card ID</th>
            <th>Booking ID</th>
            <th>Vehicle ID</th>
            <th>Technician ID</th>
            <th>Opened Date</th>
            <th>Status</th>
            <th>Tasks</th>
            <th>Actions</th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="jobCard : ${jobCards}">


            <!-- JOB CARD ID -->

            <td>

                <strong th:text="${jobCard.jobCardId}">
                    JC001
                </strong>

            </td>


            <!-- ORACLE BOOKING ID -->

            <td th:text="${jobCard.bookingId}">
            </td>


            <!-- ORACLE VEHICLE ID -->

            <td th:text="${jobCard.vehicleId}">
            </td>


            <!-- ORACLE TECHNICIAN ID -->

            <td th:text="${jobCard.technicianId}">
            </td>


            <!-- OPENED DATE -->

            <td>

                <span th:if="${jobCard.openedDate != null}"
                      th:text="${jobCard.openedDate}">
                </span>

                <span th:if="${jobCard.openedDate == null}">
                    -
                </span>

            </td>


            <!-- STATUS -->

            <td>

                <span th:if="${jobCard.status == 'Open'}"
                      class="status-open"
                      th:text="${jobCard.status}">
                </span>

                <span th:if="${jobCard.status == 'In Progress'}"
                      class="status-progress"
                      th:text="${jobCard.status}">
                </span>

                <span th:if="${jobCard.status == 'Completed'}"
                      class="status-completed"
                      th:text="${jobCard.status}">
                </span>

                <span th:if="${jobCard.status == 'Cancelled'}"
                      class="status-cancelled"
                      th:text="${jobCard.status}">
                </span>

                <span th:if="${jobCard.status == null}">
                    -
                </span>

            </td>


            <!-- MONGODB EMBEDDED TASKS -->

            <td>

                <ul class="task-list"
                    th:if="${jobCard.tasks != null
                    and !jobCard.tasks.isEmpty()}">

                    <li th:each="task : ${jobCard.tasks}">

                        <span th:text="${task.description}">
                            Task
                        </span>

                        -

                        <strong th:text="${task.status}">
                            Status
                        </strong>

                    </li>

                </ul>


                <span th:if="${jobCard.tasks == null
                        or jobCard.tasks.isEmpty()}">

                    No tasks

                </span>

            </td>


            <!-- ACTIONS -->

            <td>

                <!--
                    We use the custom MongoDB field jobCardId
                    instead of the internal MongoDB document ID.
                -->

                <a class="edit-button"
                   th:href="@{/job-cards/edit/{jobCardId}
                   (jobCardId=${jobCard.jobCardId})}">

                    Edit

                </a>


                <form class="delete-form"
                      th:action="@{/job-cards/delete/{jobCardId}
                      (jobCardId=${jobCard.jobCardId})}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete this job card?');">

                    <button type="submit"
                            class="delete-button">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>


    <!-- EMPTY MESSAGE -->

    <div class="empty-message"
         th:if="${jobCards == null or jobCards.isEmpty()}">

        No MongoDB job cards found.

    </div>

</div>

</body>

</html>
