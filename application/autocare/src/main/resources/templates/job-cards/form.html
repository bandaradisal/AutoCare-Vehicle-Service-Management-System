<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${jobCard.jobCardId == null
            ? 'Add Job Card - AutoCare'
            : 'Edit Job Card - AutoCare'}">
        Job Card - AutoCare
    </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 650px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
        }

        h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .info-box {
            background-color: #eff6ff;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 5px;
            line-height: 1.5;
        }

        .save-button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .save-button:hover {
            background-color: #1d4ed8;
        }

        .cancel-button {
            margin-left: 10px;
            text-decoration: none;
            color: #374151;
        }

        .cancel-button:hover {
            text-decoration: underline;
        }
    </style>

</head>

<body>

<div class="header">

    <h1>AutoCare</h1>

    <p>
        Vehicle Service & Maintenance Management System
    </p>

</div>

<!-- DASHBOARD BUTTON -->
<div th:replace="~{fragments/navigation :: homeButton}"></div>

<div class="container">

    <h2 th:text="${jobCard.jobCardId == null
            ? 'Add Job Card'
            : 'Edit Job Card'}">

        Job Card

    </h2>


    <div class="info-box">

        Job cards are stored in <strong>MongoDB</strong>.

        <br>

        Booking, Vehicle and Technician information is connected
        with records stored in <strong>Oracle Database</strong>.

    </div>


    <form th:action="@{/job-cards/save}"
          th:object="${jobCard}"
          method="post">

        <!-- MongoDB internal document ID -->
        <input type="hidden"
               th:field="*{id}">


        <!-- JOB CARD ID -->

        <div class="form-group">

            <label>
                Job Card ID
            </label>

            <input type="text"
                   th:field="*{jobCardId}"
                   placeholder="Example: JC002"
                   required>

        </div>


        <!-- SERVICE BOOKING -->

        <div class="form-group">

            <label>
                Service Booking
            </label>

            <select th:field="*{bookingId}"
                    required>

                <option value="">
                    -- Select Booking --
                </option>

                <option th:each="booking : ${bookings}"
                        th:value="${booking.bookingId}"
                        th:text="${'Booking '
                        + booking.bookingId
                        + ' - '
                        + booking.vehicle.registrationNo
                        + ' - '
                        + booking.serviceType
                        + ' - '
                        + booking.vehicle.customer.firstName
                        + ' '
                        + booking.vehicle.customer.lastName}">
                </option>

            </select>

        </div>


        <!-- TECHNICIAN -->

        <div class="form-group">

            <label>
                Technician
            </label>

            <select th:field="*{technicianId}"
                    required>

                <option value="">
                    -- Select Technician --
                </option>

                <option th:each="technician : ${technicians}"
                        th:value="${technician.technicianId}"
                        th:text="${technician.technicianId
                        + ' - '
                        + technician.firstName
                        + ' '
                        + technician.lastName
                        + ' - '
                        + technician.specialization}">
                </option>

            </select>

        </div>


        <!-- STATUS -->

        <div class="form-group">

            <label>
                Status
            </label>

            <select th:field="*{status}"
                    required>

                <option value="Open">
                    Open
                </option>

                <option value="In Progress">
                    In Progress
                </option>

                <option value="Completed">
                    Completed
                </option>

                <option value="Cancelled">
                    Cancelled
                </option>

            </select>

        </div>


        <!-- SAVE -->

        <button type="submit"
                class="save-button"
                th:text="${jobCard.jobCardId == null
                ? 'Save Job Card'
                : 'Update Job Card'}">

            Save Job Card

        </button>


        <!-- CANCEL -->

        <a th:href="@{/job-cards}"
           class="cancel-button">

            Cancel

        </a>

    </form>

</div>

</body>

</html>
