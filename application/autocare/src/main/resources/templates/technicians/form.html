<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${technician.technicianId == null
            ? 'Add Technician - AutoCare'
            : 'Edit Technician - AutoCare'}">
        Technician - AutoCare
    </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 650px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
        }

        h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .save-button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .save-button:hover {
            background-color: #1d4ed8;
        }

        .cancel-button {
            margin-left: 10px;
            text-decoration: none;
            color: #374151;
        }

        .cancel-button:hover {
            text-decoration: underline;
        }
    </style>

</head>

<body>

<div class="header">

    <h1>AutoCare</h1>

    <p>
        Vehicle Service & Maintenance Management System
    </p>

</div>

<!-- DASHBOARD BUTTON -->
<div th:replace="~{fragments/navigation :: homeButton}"></div>

<div class="container">

    <h2 th:text="${technician.technicianId == null
            ? 'Add Technician'
            : 'Edit Technician'}">

        Technician

    </h2>

    <form th:action="@{/technicians/save}"
          th:object="${technician}"
          method="post">

        <!-- Keep technician ID when editing -->
        <input type="hidden"
               th:field="*{technicianId}">


        <!-- FIRST NAME -->

        <div class="form-group">

            <label>
                First Name
            </label>

            <input type="text"
                   th:field="*{firstName}"
                   placeholder="Enter first name"
                   required>

        </div>


        <!-- LAST NAME -->

        <div class="form-group">

            <label>
                Last Name
            </label>

            <input type="text"
                   th:field="*{lastName}"
                   placeholder="Enter last name"
                   required>

        </div>


        <!-- PHONE -->

        <div class="form-group">

            <label>
                Phone
            </label>

            <input type="text"
                   th:field="*{phone}"
                   placeholder="Enter phone number"
                   required>

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label>
                Email
            </label>

            <input type="email"
                   th:field="*{email}"
                   placeholder="Enter email address">

        </div>


        <!-- SPECIALIZATION -->

        <div class="form-group">

            <label>
                Specialization
            </label>

            <select th:field="*{specialization}">

                <option value="">
                    -- Select Specialization --
                </option>

                <option value="Engine Repair">
                    Engine Repair
                </option>

                <option value="Electrical Systems">
                    Electrical Systems
                </option>

                <option value="Brake and Suspension">
                    Brake and Suspension
                </option>

                <option value="General Maintenance">
                    General Maintenance
                </option>

                <option value="Engine and Mechanical Repair">
                    Engine and Mechanical Repair
                </option>

            </select>

        </div>


        <!-- EXPERIENCE -->

        <div class="form-group">

            <label>
                Experience Years
            </label>

            <input type="number"
                   th:field="*{experienceYears}"
                   min="0"
                   max="60"
                   placeholder="Example: 5">

        </div>


        <!-- STATUS -->

        <div class="form-group">

            <label>
                Status
            </label>

            <select th:field="*{status}"
                    required>

                <option value="Available">
                    Available
                </option>

                <option value="Assigned">
                    Assigned
                </option>

                <option value="On Leave">
                    On Leave
                </option>

                <option value="Inactive">
                    Inactive
                </option>

            </select>

        </div>


        <!-- SAVE -->

        <button type="submit"
                class="save-button"
                th:text="${technician.technicianId == null
                ? 'Save Technician'
                : 'Update Technician'}">

            Save Technician

        </button>


        <!-- CANCEL -->

        <a th:href="@{/technicians}"
           class="cancel-button">

            Cancel

        </a>

    </form>

</div>

</body>

</html>
