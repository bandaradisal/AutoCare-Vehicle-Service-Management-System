<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Technicians - AutoCare</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 92%;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .add-button {
            background-color: #2563eb;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
        }

        .add-button:hover {
            background-color: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #e5e7eb;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .edit-button {
            background-color: #f59e0b;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-right: 5px;
        }

        .edit-button:hover {
            background-color: #d97706;
        }

        .delete-form {
            display: inline;
        }

        .delete-button {
            background-color: #dc2626;
            color: white;
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-button:hover {
            background-color: #b91c1c;
        }

        .empty-message {
            background-color: white;
            padding: 20px;
            text-align: center;
        }
    </style>

</head>

<body>

<div class="header">

    <h1>AutoCare</h1>

    <p>
        Vehicle Service & Maintenance Management System
    </p>

</div>

<!-- DASHBOARD BUTTON -->
<div th:replace="~{fragments/navigation :: homeButton}"></div>

<div class="container">

    <div class="top-bar">

        <h2>
            Technician Management
        </h2>

        <a th:href="@{/technicians/new}"
           class="add-button">

            + Add Technician

        </a>

    </div>


    <!-- TECHNICIAN TABLE -->

    <table th:if="${technicians != null and !technicians.isEmpty()}">

        <thead>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Specialization</th>
            <th>Experience</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="technician : ${technicians}">

            <!-- ID -->
            <td th:text="${technician.technicianId}">
            </td>


            <!-- NAME -->
            <td th:text="${technician.firstName
                    + ' '
                    + technician.lastName}">
            </td>


            <!-- PHONE -->
            <td th:text="${technician.phone}">
            </td>


            <!-- EMAIL -->
            <td>

                <span th:if="${technician.email != null and !technician.email.isBlank()}"
                      th:text="${technician.email}">
                </span>

                <span th:if="${technician.email == null or technician.email.isBlank()}">
                    -
                </span>

            </td>


            <!-- SPECIALIZATION -->
            <td>

                <span th:if="${technician.specialization != null and !technician.specialization.isBlank()}"
                      th:text="${technician.specialization}">
                </span>

                <span th:if="${technician.specialization == null or technician.specialization.isBlank()}">
                    -
                </span>

            </td>


            <!-- EXPERIENCE -->
            <td>

                <span th:if="${technician.experienceYears != null}"
                      th:text="${technician.experienceYears + ' Years'}">
                </span>

                <span th:if="${technician.experienceYears == null}">
                    -
                </span>

            </td>


            <!-- STATUS -->
            <td th:text="${technician.status}">
            </td>


            <!-- ACTIONS -->
            <td>

                <a class="edit-button"
                   th:href="@{/technicians/edit/{id}
                   (id=${technician.technicianId})}">

                    Edit

                </a>

                <form class="delete-form"
                      th:action="@{/technicians/delete/{id}
                      (id=${technician.technicianId})}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete this technician?');">

                    <button type="submit"
                            class="delete-button">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>


    <!-- EMPTY MESSAGE -->

    <div class="empty-message"
         th:if="${technicians == null or technicians.isEmpty()}">

        No technicians found.

    </div>

</div>

</body>

</html>
